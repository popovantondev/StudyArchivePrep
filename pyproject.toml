[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "study-archive-prep"
version = "0.1.0"
description = "Prepare dated study materials and ordered Telegram publication plans"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["PySide6==6.11.2"]

[project.optional-dependencies]
build = ["pyinstaller==6.19.0"]

[project.scripts]
study-archive-prep = "study_archive_prep.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
study_archive_prep = ["assets/*"]
